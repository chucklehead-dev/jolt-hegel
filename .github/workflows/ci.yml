name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BB_FORK_REPOSITORY: casselc/babashka
  BB_FORK_REF: 26367edf91905eb85c68e6fd77f3e108a60dc651

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          clj-kondo: latest
      - name: Lint portable source, scripts, and tests
        run: clj-kondo --fail-level warning --lint src script test

  abi-data:
    name: ABI descriptor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Validate descriptor and JVM coverage without loading libhegel
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:abi-test

  bb-native-image:
    name: Native image / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            artifact: bb-fork-linux-amd64
            binary: bb-portable
            shell: bash
          - name: Windows x86_64
            runner: windows-2022
            artifact: bb-fork-windows-amd64
            binary: bb.exe
            shell: pwsh
          - name: macOS arm64
            runner: macos-14
            artifact: bb-fork-macos-arm64
            binary: bb-portable
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Check out the pinned Babashka fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.BB_FORK_REPOSITORY }}
          ref: ${{ env.BB_FORK_REF }}
          submodules: recursive
          persist-credentials: false

      - name: Cache pinned native image
        id: bb-cache
        uses: actions/cache@v6
        with:
          path: ${{ matrix.binary }}
          key: bb-native-${{ runner.os }}-${{ runner.arch }}-${{ env.BB_FORK_REF }}

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest
          lein: 2.9.8

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1.3.4
        with:
          java-version: '25.0.4'
          distribution: graalvm
          components: native-image
          github-token: ${{ github.token }}

      - name: Build Babashka native image (POSIX)
        if: steps.bb-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        env:
          BABASHKA_BINARY: bb-portable
          BABASHKA_XMX: -J-Xmx6500m
          GRAALVM_HOME: ${{ env.JAVA_HOME }}
        run: |
          script/uberjar
          script/compile -Ob

      - name: Build Babashka native image (Windows)
        if: steps.bb-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: cmd
        run: |
          set GRAALVM_HOME=%JAVA_HOME%
          call bb script\gen_ffi_metadata.clj windows
          call script\uberjar.bat
          call script\compile.bat -Ob

      - name: Put POSIX binary at Babashka's test path
        if: runner.os != 'Windows'
        run: ln -sf bb-portable bb

      - name: Make Git for Windows libffi discoverable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mingw = Join-Path $env:ProgramFiles 'Git\mingw64\bin'
          $ffi = Join-Path $mingw 'libffi-8.dll'
          if (-not (Test-Path -LiteralPath $ffi)) {
            throw "Pinned Babashka libffi fallback requires $ffi"
          }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run independent Babashka FFI tests
        env:
          BABASHKA_TEST_ENV: native
        run: clojure -M:test -n babashka.ffi-test

      - name: Upload pinned Babashka runtime
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  runtime-test:
    name: ${{ matrix.runtime }} / ${{ matrix.name }}
    needs: [abi-data, bb-native-image]
    # A failure in one native-image cell must not hide unrelated Jolt/JVM
    # evidence. The matching Babashka cell will still fail when its artifact is
    # unavailable.
    if: always() && needs.abi-data.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Jolt
            host: jolt
            name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
            jolt-asset: jolt-v0.7.23-x86_64-linux.tar.gz
            jolt-sha256: feda9a68792b454fa540677069edc6b6d9b82aa8ab77ae8a322934f0b8cd32e7
          - runtime: Jolt
            host: jolt
            name: Windows x86_64
            runner: windows-2022
            shell: pwsh
            jolt-asset: jolt-v0.7.23-x86_64-windows.zip
            jolt-sha256: d414dc30d6992613f8bf1bd6a5fd709fd583ef564ce9b684bc2f90a5be498074
          - runtime: Jolt
            host: jolt
            name: macOS arm64
            runner: macos-14
            shell: bash
            jolt-asset: jolt-v0.7.23-aarch64-macos.tar.gz
            jolt-sha256: 2e4b9804382548b58b10079aa73688afe587d7b6d0986ee52c61f843ae912bb9
          - runtime: Babashka
            host: bb
            name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
            bb-artifact: bb-fork-linux-amd64
            bb-binary: bb-portable
          - runtime: Babashka
            host: bb
            name: Windows x86_64
            runner: windows-2022
            shell: pwsh
            bb-artifact: bb-fork-windows-amd64
            bb-binary: bb.exe
          - runtime: Babashka
            host: bb
            name: macOS arm64
            runner: macos-14
            shell: bash
            bb-artifact: bb-fork-macos-arm64
            bb-binary: bb-portable
          - runtime: JVM
            host: jvm
            name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
          - runtime: JVM
            host: jvm
            name: Windows x86_64
            runner: windows-2022
            shell: pwsh
          - runtime: JVM
            host: jvm
            name: macOS arm64
            runner: macos-14
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    env:
      HEGEL_CACHE_DIR: ${{ github.workspace }}/.hegel-lib
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenSSL for Jolt on macOS
        if: matrix.host == 'jolt' && runner.os == 'macOS'
        run: brew install openssl@3

      - name: Install Jolt
        if: matrix.host == 'jolt'
        uses: ./.github/actions/setup-jolt
        with:
          version: 0.7.23
          asset: ${{ matrix.jolt-asset }}
          sha256: ${{ matrix.jolt-sha256 }}

      - name: Download pinned Babashka runtime
        if: matrix.host == 'bb'
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.bb-artifact }}
          path: ${{ runner.temp }}/bb-fork

      - name: Put Babashka on PATH (POSIX)
        if: matrix.host == 'bb' && runner.os != 'Windows'
        run: |
          chmod +x "$RUNNER_TEMP/bb-fork/${{ matrix.bb-binary }}"
          ln -s "$RUNNER_TEMP/bb-fork/${{ matrix.bb-binary }}" "$RUNNER_TEMP/bb-fork/bb"
          echo "$RUNNER_TEMP/bb-fork" >> "$GITHUB_PATH"

      - name: Put Babashka and libffi on PATH (Windows)
        if: matrix.host == 'bb' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $bbDir = Join-Path $env:RUNNER_TEMP 'bb-fork'
          $mingw = Join-Path $env:ProgramFiles 'Git\mingw64\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $mingw 'libffi-8.dll'))) {
            throw 'Git for Windows libffi-8.dll is required by the pinned Babashka runtime'
          }
          $bbDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up JDK 25
        if: matrix.host == 'jvm'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure CLI
        if: matrix.host == 'jvm' || matrix.host == 'bb'
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - name: Install libhegel (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -m hegel.install fetch-libhegel

      - name: Install libhegel (Babashka)
        if: matrix.host == 'bb'
        run: bb -m hegel.install fetch-libhegel

      - name: Install libhegel (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:setup-native

      - name: Check ABI coverage (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -M:abi-test

      - name: Check ABI coverage (Babashka)
        if: matrix.host == 'bb'
        run: bb abi-test

      - name: Check ABI coverage (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:abi-test

      - name: Run semantic suite (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -M:test

      - name: Run semantic suite (Babashka)
        if: matrix.host == 'bb'
        run: bb test

      - name: Run semantic suite (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:test

      - name: Run Git dependency consumer smoke test (Jolt)
        if: matrix.host == 'jolt'
        working-directory: test/consumer
        run: jolt -A:test -m consumer.smoke

      - name: Run Git dependency consumer smoke test (Babashka)
        if: matrix.host == 'bb'
        working-directory: test/consumer
        run: bb --config bb.edn -m consumer.smoke

      - name: Run Git dependency consumer smoke test (JVM)
        if: matrix.host == 'jvm'
        working-directory: test/consumer
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:test -m consumer.smoke

  jdk22-minimum:
    name: JVM minimum / Linux x86_64
    needs: abi-data
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HEGEL_CACHE_DIR: ${{ github.workspace }}/.hegel-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Install libhegel
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:setup-native
      - name: Run ABI and semantic suites
        run: |
          clojure -J--enable-native-access=ALL-UNNAMED -M:abi-test
          clojure -J--enable-native-access=ALL-UNNAMED -M:test

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
            jolt-asset: jolt-v0.7.23-x86_64-linux.tar.gz
            jolt-sha256: feda9a68792b454fa540677069edc6b6d9b82aa8ab77ae8a322934f0b8cd32e7
          - name: Windows x86_64
            runner: windows-2022
            # Maven resolution loads Git for Windows' OpenSSL DLLs through the
            # native Windows search path. Windows PowerShell preserves that
            # path and the module environment used by the installer's checksum
            # subprocess; MSYS translation prevents Jolt from loading the DLLs.
            shell: powershell
            jolt-asset: jolt-v0.7.23-x86_64-windows.zip
            jolt-sha256: d414dc30d6992613f8bf1bd6a5fd709fd583ef564ce9b684bc2f90a5be498074
          - name: macOS arm64
            runner: macos-14
            shell: bash
            jolt-asset: jolt-v0.7.23-aarch64-macos.tar.gz
            jolt-sha256: 2e4b9804382548b58b10079aa73688afe587d7b6d0986ee52c61f843ae912bb9

    defaults:
      run:
        shell: ${{ matrix.shell }}

    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenSSL for Jolt on macOS
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - uses: ./.github/actions/setup-jolt
        with:
          version: 0.7.23
          asset: ${{ matrix.jolt-asset }}
          sha256: ${{ matrix.jolt-sha256 }}

      - name: Prime the Jolt namespace cache from the library checkout
        run: jolt -m hegel.install paths

      - name: Install native dependencies through the consumer-visible API
        working-directory: test/consumer
        run: jolt -A:test -m hegel.install fetch-libhegel

      - name: Run integration suite
        run: jolt -M:test

      - name: Run Git dependency consumer smoke test
        working-directory: test/consumer
        run: jolt -A:test -m consumer.smoke

name: CI

on:
  push:
    branches:
      - main
      - agent/jolt-hegel-v020-release
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            jolt-asset: jolt-v0.7.5-x86_64-linux.tar.gz
            jolt-sha256: 1c037bd4897d6f819eda188483234af03164b7f7ef765ecb86703b62a4edef7e
          - name: Windows x86_64
            runner: windows-2022
            jolt-asset: jolt-v0.7.5-x86_64-windows.zip
            jolt-sha256: 21f6705992c2448667321fd0dcee990f51ccd2a620e0ac3101444157ebe75dc1
          - name: macOS arm64
            runner: macos-14
            jolt-asset: jolt-v0.7.5-aarch64-macos.tar.gz
            jolt-sha256: f65b597e81cafa99c908115e2ed3898e2bac4edcdabbf4bfc5d291d3e4bbfc0b

    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenSSL for Jolt on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install openssl@3

      - uses: ./.github/actions/setup-jolt
        with:
          version: 0.7.5
          asset: ${{ matrix.jolt-asset }}
          sha256: ${{ matrix.jolt-sha256 }}

      - name: Prime the Jolt namespace cache from the library checkout
        shell: bash
        run: jolt -m hegel.install paths

      - name: Install native dependencies through the consumer-visible API
        working-directory: test/consumer
        shell: bash
        run: |
          jolt -A:test -m hegel.install fetch-libhegel
          jolt -A:test -m hegel.install build-shim

      - name: Run integration suite
        shell: bash
        run: jolt -M:test

      - name: Run Git dependency consumer smoke test
        working-directory: test/consumer
        shell: bash
        run: jolt -A:test -m consumer.smoke

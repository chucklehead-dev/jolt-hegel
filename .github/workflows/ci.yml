name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          clj-kondo: latest
      - name: Lint portable source, scripts, and tests
        run: clj-kondo --fail-level warning --lint src script test

  abi-data:
    name: ABI descriptor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Validate descriptor and JVM coverage without loading libhegel
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:abi-test

  runtime-test:
    name: ${{ matrix.runtime }} / ${{ matrix.name }}
    needs: abi-data
    if: always() && needs.abi-data.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Jolt
            host: jolt
            name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
            jolt-asset: jolt-v0.7.23-x86_64-linux.tar.gz
            jolt-sha256: feda9a68792b454fa540677069edc6b6d9b82aa8ab77ae8a322934f0b8cd32e7
          - runtime: Jolt
            host: jolt
            name: Windows x86_64
            runner: windows-2022
            shell: pwsh
            jolt-asset: jolt-v0.7.23-x86_64-windows.zip
            jolt-sha256: d414dc30d6992613f8bf1bd6a5fd709fd583ef564ce9b684bc2f90a5be498074
          - runtime: Jolt
            host: jolt
            name: macOS arm64
            runner: macos-14
            shell: bash
            jolt-asset: jolt-v0.7.23-aarch64-macos.tar.gz
            jolt-sha256: 2e4b9804382548b58b10079aa73688afe587d7b6d0986ee52c61f843ae912bb9
          - runtime: Babashka
            host: bb
            name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
          - runtime: Babashka
            host: bb
            name: Windows x86_64
            runner: windows-2022
            shell: pwsh
          - runtime: Babashka
            host: bb
            name: macOS arm64
            runner: macos-14
            shell: bash
          - runtime: JVM
            host: jvm
            name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
          - runtime: JVM
            host: jvm
            name: Windows x86_64
            runner: windows-2022
            shell: pwsh
          - runtime: JVM
            host: jvm
            name: macOS arm64
            runner: macos-14
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    env:
      HEGEL_CACHE_DIR: ${{ github.workspace }}/.hegel-lib
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenSSL for Jolt on macOS
        if: matrix.host == 'jolt' && runner.os == 'macOS'
        run: brew install openssl@3

      - name: Install Jolt
        if: matrix.host == 'jolt'
        uses: ./.github/actions/setup-jolt
        with:
          version: 0.7.23
          asset: ${{ matrix.jolt-asset }}
          sha256: ${{ matrix.jolt-sha256 }}

      - name: Make Git for Windows libffi discoverable
        if: matrix.host == 'bb' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $mingw = Join-Path $env:ProgramFiles 'Git\mingw64\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $mingw 'libffi-8.dll'))) {
            throw 'Git for Windows libffi-8.dll is required by Babashka FFI'
          }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up JDK 25
        if: matrix.host == 'jvm'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure CLI and official Babashka
        if: matrix.host == 'jvm' || matrix.host == 'bb'
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: 1.13.220

      - name: Install libhegel (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -m hegel.install fetch-libhegel

      - name: Install libhegel (Babashka)
        if: matrix.host == 'bb'
        run: bb -m hegel.install fetch-libhegel

      - name: Install libhegel (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:setup-native

      - name: Check ABI coverage (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -M:abi-test

      - name: Check ABI coverage (Babashka)
        if: matrix.host == 'bb'
        run: bb abi-test

      - name: Check ABI coverage (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:abi-test

      - name: Run semantic suite (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -M:test

      - name: Run semantic suite (Babashka)
        if: matrix.host == 'bb'
        run: bb test

      - name: Run semantic suite (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:test

      - name: Run Git dependency consumer smoke test (Jolt)
        if: matrix.host == 'jolt'
        working-directory: test/consumer
        run: jolt -A:test -m consumer.smoke

      - name: Run Git dependency consumer smoke test (Babashka)
        if: matrix.host == 'bb'
        working-directory: test/consumer
        run: bb --config bb.edn -m consumer.smoke

      - name: Run Git dependency consumer smoke test (JVM)
        if: matrix.host == 'jvm'
        working-directory: test/consumer
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:test -m consumer.smoke

  jdk22-minimum:
    name: JVM minimum / Linux x86_64
    needs: abi-data
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HEGEL_CACHE_DIR: ${{ github.workspace }}/.hegel-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: Install libhegel
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:setup-native
      - name: Run ABI and semantic suites
        run: |
          clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:abi-test
          clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:test

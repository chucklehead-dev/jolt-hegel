name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-engine-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the pinned libhegel temporal and reporting contracts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download libhegel/0.53.2 --repo hegeldev/hegel \
            --pattern hegel.h --pattern libhegel-linux-amd64.so --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          echo '85ed986136bb213c8904f90f920d6eb1420cad814aa229357e21b4643573512f  hegel.h' | sha256sum -c -
          echo 'ce6cc514aac3d2c6e557bf9520b3af6280b3bb735a4d736e882d0344b1476bd2  libhegel-linux-amd64.so' | sha256sum -c -
          cc -std=c99 -Wall -Wextra -Werror -I. "$GITHUB_WORKSPACE/script/hegel/candidate_contract_053.c" \
            ./libhegel-linux-amd64.so -o candidate-contract
          ./candidate-contract
      - uses: ./.github/actions/setup-jolt
        with:
          version: '0.8.30'
          asset: jolt-v0.8.30-x86_64-linux.tar.gz
          sha256: c9eb00ce9b58e6ab19dcfc324edad2ad5127bab7339e8d018ce2c30876037bdd
      - name: Drive Hegel output through a Jolt callback and a native callback pointer
        run: |
          cd "$RUNNER_TEMP"
          cc -std=c99 -Wall -Wextra -Werror -shared -fPIC -I. \
            "$GITHUB_WORKSPACE/script/hegel/candidate_contract_053.c" ./libhegel-linux-amd64.so -o candidate-driver.so
          jolt "$GITHUB_WORKSPACE/script/hegel/candidate_output_053.clj" \
            "$PWD/libhegel-linux-amd64.so" "$PWD/candidate-driver.so" 2>pointer-output.log || { cat pointer-output.log; exit 1; }
          grep -Fx 'pointer-sink: λ' pointer-output.log
      - name: Verify by-value Jolt callback and native time zone loader ownership
        run: |
          cd "$RUNNER_TEMP"
          jolt -Scp "$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/resources" \
            "$GITHUB_WORKSPACE/script/hegel/zone_loader_contract.clj" "$PWD/libhegel-linux-amd64.so"
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          clj-kondo: latest
      - name: Lint portable source, scripts, tests, and the typed pilot
        run: clj-kondo --fail-level warning --lint src script test typed

  typed-check:
    name: Typed Clojure pilot (JVM, text-size body checked, validate! contract-checked only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
      - name: Check annotations, text-size's body, validate!'s call-site contract, a valid driver, and reject every mutant control
        run: clojure -M:typed-check

  abi-data:
    name: ABI descriptor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
      - name: Validate descriptor and JVM coverage without loading libhegel
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:abi-test

  header-audit:
    name: Pinned C header / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2022]
    env:
      HEGEL_ABI_CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
      - name: Compare pinned header, compiler layouts, constants, units and mutants
        run: clojure -M:header-audit

  bb-native-image:
    # Preserve the historical required-check names while verifying the
    # released Babashka runtime that replaced our temporary native-image fork.
    name: Native image / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            asset: babashka-1.13.230-linux-amd64.tar.gz
            sha256: 590a131ec3456c2313ebcb5ae2ee6836ca1f01f481da08320cd8c8f46d3644f9
          - name: Windows x86_64
            runner: windows-2022
            asset: babashka-1.13.230-windows-amd64.zip
            sha256: e49f1992a3d4e73e46f2245707decb02163ce07a84b48f64bbd3c5a9ba6b5fb8
          - name: macOS arm64
            runner: macos-26
            asset: babashka-1.13.230-macos-aarch64.tar.gz
            sha256: 3adcd97eeb3ebe324cf3a0be6d969a5626a14783596d3cad911b2f4b95809cea

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify official FFI-capable Babashka
        uses: ./.github/actions/setup-babashka
        with:
          version: 1.13.230
          asset: ${{ matrix.asset }}
          sha256: ${{ matrix.sha256 }}

  runtime-test:
    name: ${{ matrix.runtime }} / ${{ matrix.name }}
    needs: abi-data
    if: always() && needs.abi-data.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Jolt
            host: jolt
            name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
            # Official jolt-lang/jolt v0.8.30, source commit
            # f6ed60a335960dc0657f7f98457b01426ae4cf90.
            jolt-version: 0.8.30
            jolt-asset: jolt-v0.8.30-x86_64-linux.tar.gz
            jolt-sha256: c9eb00ce9b58e6ab19dcfc324edad2ad5127bab7339e8d018ce2c30876037bdd
          - runtime: Jolt
            host: jolt
            name: Windows x86_64
            runner: windows-2022
            shell: pwsh
            # Official jolt-lang/jolt v0.8.30, source commit
            # f6ed60a335960dc0657f7f98457b01426ae4cf90.
            jolt-version: 0.8.30
            jolt-asset: jolt-v0.8.30-x86_64-windows.zip
            jolt-sha256: db5465cb5e273134734fec7a0a1b3101f41b8b999fb8a593f1454bc319c21f96
          - runtime: Jolt
            host: jolt
            name: macOS arm64
            runner: macos-26
            shell: bash
            # Official jolt-lang/jolt v0.8.30, source commit
            # f6ed60a335960dc0657f7f98457b01426ae4cf90.
            jolt-version: 0.8.30
            jolt-asset: jolt-v0.8.30-aarch64-macos.tar.gz
            jolt-sha256: 0736bb9a3764835bdc407db81b5a442b333899752b09f8700968fc9afda85536
          # Keep the declared compatibility floor executable without making it
          # the primary cross-platform runtime. This row runs every existing
          # Jolt gate below, including the Linux-only relocated consumer.
          - runtime: Jolt
            host: jolt
            name: Linux x86_64 (minimum 0.8.1)
            runner: ubuntu-24.04
            shell: bash
            jolt-version: 0.8.1
            jolt-asset: jolt-v0.8.1-x86_64-linux.tar.gz
            jolt-sha256: ddca03c95190a8079c3674482187782796031cf0de685ee29411f08481bc440c
          - runtime: Babashka
            host: bb
            name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
            bb-asset: babashka-1.13.230-linux-amd64.tar.gz
            bb-sha256: 590a131ec3456c2313ebcb5ae2ee6836ca1f01f481da08320cd8c8f46d3644f9
          - runtime: Babashka
            host: bb
            name: Windows x86_64
            runner: windows-2022
            shell: pwsh
            bb-asset: babashka-1.13.230-windows-amd64.zip
            bb-sha256: e49f1992a3d4e73e46f2245707decb02163ce07a84b48f64bbd3c5a9ba6b5fb8
          - runtime: Babashka
            host: bb
            name: macOS arm64
            runner: macos-26
            shell: bash
            bb-asset: babashka-1.13.230-macos-aarch64.tar.gz
            bb-sha256: 3adcd97eeb3ebe324cf3a0be6d969a5626a14783596d3cad911b2f4b95809cea
          - runtime: JVM
            host: jvm
            name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
          - runtime: JVM
            host: jvm
            name: Windows x86_64
            runner: windows-2022
            shell: pwsh
          - runtime: JVM
            host: jvm
            name: macOS arm64
            runner: macos-26
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    env:
      HEGEL_CACHE_DIR: ${{ github.workspace }}/.hegel-lib
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenSSL for Jolt on macOS
        if: matrix.host == 'jolt' && runner.os == 'macOS'
        run: brew install openssl@3

      - name: Install Jolt
        if: matrix.host == 'jolt'
        uses: ./.github/actions/setup-jolt
        with:
          version: ${{ matrix.jolt-version }}
          asset: ${{ matrix.jolt-asset }}
          sha256: ${{ matrix.jolt-sha256 }}

      - name: Set up JDK 25
        if: matrix.host == 'jvm'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure CLI and official Babashka
        if: matrix.host == 'jvm'
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - name: Set up official FFI-capable Babashka
        if: matrix.host == 'bb'
        uses: ./.github/actions/setup-babashka
        with:
          version: 1.13.230
          asset: ${{ matrix.bb-asset }}
          sha256: ${{ matrix.bb-sha256 }}

      - name: Check corpus integrity without libhegel (Jolt)
        if: matrix.host == 'jolt'
        env:
          HEGEL_LIBHEGEL_LIBRARY: deliberately-missing-corpus-native-library
        run: jolt -M:corpus-test

      - name: Check corpus integrity without libhegel (Babashka)
        if: matrix.host == 'bb'
        env:
          HEGEL_LIBHEGEL_LIBRARY: deliberately-missing-corpus-native-library
        run: bb corpus-test

      - name: Check corpus integrity without libhegel or JVM FFI dependency (JVM)
        if: matrix.host == 'jvm'
        env:
          HEGEL_LIBHEGEL_LIBRARY: deliberately-missing-corpus-native-library
        run: clojure -M:corpus-test

      - name: Install libhegel (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -m hegel.install fetch-libhegel

      - name: Install libhegel (Babashka)
        if: matrix.host == 'bb'
        run: bb -m hegel.install fetch-libhegel

      - name: Install libhegel (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:setup-native

      - name: Check ABI coverage (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -M:abi-test

      - name: Check ABI coverage (Babashka)
        if: matrix.host == 'bb'
        run: bb abi-test

      - name: Check ABI coverage (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:abi-test

      - name: Run semantic suite (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -M:test

      - name: Run contract harness controls (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -M:harness-test

      - name: Probe bootstrap optional loading (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -M:test --bootstrap-load-probe

      - name: Build and relocate standalone resource consumer (Jolt Linux)
        if: matrix.host == 'jolt' && runner.os == 'Linux'
        run: bash script/check-standalone-resources.sh

      - name: Acquire native package and check supported static relocation (current Jolt)
        if: matrix.host == 'jolt' && matrix.jolt-version == '0.8.30'
        run: bash script/check-native-package.sh

      - name: Check unrecorded Antithesis workload failure
        if: matrix.host == 'bb' && runner.os == 'Linux'
        shell: bash
        run: |
          workload_output="$(mktemp -d)"
          ANTITHESIS_OUTPUT_DIR="$workload_output" bb -cp src:resources:script -m hegel.workload-smoke

      - name: Run semantic suite (Babashka)
        if: matrix.host == 'bb'
        run: bb test

      - name: Run contract harness controls (Babashka)
        if: matrix.host == 'bb'
        run: bb harness-test

      - name: Probe bootstrap optional loading (Babashka)
        if: matrix.host == 'bb'
        run: bb test --bootstrap-load-probe

      - name: Reject a literal task name passed as a test argument (Babashka)
        if: matrix.host == 'bb'
        run: >-
          bb -e '(require (quote clojure.java.shell))
          (let [result (clojure.java.shell/sh "bb" "test" "test" "--list-suites")]
          (when-not (= 2 (:exit result))
          (throw (ex-info "Test task changed user arguments" result))))'

      - name: Run semantic suite (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:test

      - name: Run contract harness controls (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:harness-test

      - name: Probe bootstrap optional loading (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:test --bootstrap-load-probe

      - name: Run Git dependency consumer smoke test (Jolt)
        if: matrix.host == 'jolt'
        working-directory: test/consumer
        run: jolt -A:test -m consumer.smoke

      - name: Run Git dependency consumer smoke test (Babashka)
        if: matrix.host == 'bb'
        working-directory: test/consumer
        run: bb --config bb.edn -m consumer.smoke

      - name: Run Git dependency consumer smoke test (JVM)
        if: matrix.host == 'jvm'
        working-directory: test/consumer
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:test -m consumer.smoke

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          clj-kondo: latest
      - name: Lint portable source, scripts, tests, and the typed pilot
        run: clj-kondo --fail-level warning --lint src script test typed

  typed-check:
    name: Typed Clojure pilot (JVM, text-size body checked, validate! contract-checked only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest
      - name: Check annotations, text-size's body, validate!'s call-site contract, a valid driver, and reject every mutant control
        run: clojure -M:typed-check

  abi-data:
    name: ABI descriptor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest
      - name: Validate descriptor and JVM coverage without loading libhegel
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:abi-test

  header-audit:
    name: Pinned C header / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    env:
      HEGEL_ABI_CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest
      - name: Compare pinned header, compiler layouts, constants, units and mutants
        run: clojure -M:header-audit

  bb-native-image:
    # Preserve the historical required-check names while verifying the
    # released Babashka runtime that replaced our temporary native-image fork.
    name: Native image / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            asset: babashka-1.13.220-linux-amd64.tar.gz
            sha256: 5211ebf6267be2dbbf4857611cb01331b865bf6b0a8c9bc500c83a816df1a769
          - name: Windows x86_64
            runner: windows-2022
            asset: babashka-1.13.220-windows-amd64.zip
            sha256: baf87302db04377d44f10dd1cb5c29924fc418d5765dc149213e793be5de0e9e
          - name: macOS arm64
            runner: macos-14
            asset: babashka-1.13.220-macos-aarch64.tar.gz
            sha256: f7d18c3ab11bb4ad0e32a45c1ae40ae25911d5fa06ba4ded07cb90b8af158077

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Make Git for Windows libffi discoverable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mingw = Join-Path $env:ProgramFiles 'Git\mingw64\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $mingw 'libffi-8.dll'))) {
            throw 'Git for Windows libffi-8.dll is required by Babashka FFI'
          }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify official FFI-capable Babashka
        uses: ./.github/actions/setup-babashka
        with:
          version: 1.13.220
          asset: ${{ matrix.asset }}
          sha256: ${{ matrix.sha256 }}

  runtime-test:
    name: ${{ matrix.runtime }} / ${{ matrix.name }}
    needs: abi-data
    if: always() && needs.abi-data.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Jolt
            host: jolt
            name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
            # Official jolt-lang/jolt v0.8.3, source commit
            # 343f730922cf16fafe673b466cedcdcfe0596854.
            jolt-version: 0.8.3
            jolt-asset: jolt-v0.8.3-x86_64-linux.tar.gz
            jolt-sha256: e567297a6a840d9988a1aa082beb430aeaa0e6610a82a6f9ee0564e117745147
          - runtime: Jolt
            host: jolt
            name: Windows x86_64
            runner: windows-2022
            shell: pwsh
            # Official jolt-lang/jolt v0.8.3, source commit
            # 343f730922cf16fafe673b466cedcdcfe0596854.
            jolt-version: 0.8.3
            jolt-asset: jolt-v0.8.3-x86_64-windows.zip
            jolt-sha256: d2a01654d49837f4c22868d75a89c12bdac7ebc003e1df62cba56fb1ded743f6
          - runtime: Jolt
            host: jolt
            name: macOS arm64
            runner: macos-14
            shell: bash
            # Official jolt-lang/jolt v0.8.3, source commit
            # 343f730922cf16fafe673b466cedcdcfe0596854.
            jolt-version: 0.8.3
            jolt-asset: jolt-v0.8.3-aarch64-macos.tar.gz
            jolt-sha256: ef70f96c238061390e5099ddc188293edb2c5868bbc19e9019a929b038fa2d97
          # Keep the declared compatibility floor executable without making it
          # the primary cross-platform runtime. This row runs every existing
          # Jolt gate below, including the Linux-only relocated consumer.
          - runtime: Jolt
            host: jolt
            name: Linux x86_64 (minimum 0.8.1)
            runner: ubuntu-24.04
            shell: bash
            jolt-version: 0.8.1
            jolt-asset: jolt-v0.8.1-x86_64-linux.tar.gz
            jolt-sha256: ddca03c95190a8079c3674482187782796031cf0de685ee29411f08481bc440c
          - runtime: Babashka
            host: bb
            name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
            bb-asset: babashka-1.13.220-linux-amd64.tar.gz
            bb-sha256: 5211ebf6267be2dbbf4857611cb01331b865bf6b0a8c9bc500c83a816df1a769
          - runtime: Babashka
            host: bb
            name: Windows x86_64
            runner: windows-2022
            shell: pwsh
            bb-asset: babashka-1.13.220-windows-amd64.zip
            bb-sha256: baf87302db04377d44f10dd1cb5c29924fc418d5765dc149213e793be5de0e9e
          - runtime: Babashka
            host: bb
            name: macOS arm64
            runner: macos-14
            shell: bash
            bb-asset: babashka-1.13.220-macos-aarch64.tar.gz
            bb-sha256: f7d18c3ab11bb4ad0e32a45c1ae40ae25911d5fa06ba4ded07cb90b8af158077
          - runtime: JVM
            host: jvm
            name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
          - runtime: JVM
            host: jvm
            name: Windows x86_64
            runner: windows-2022
            shell: pwsh
          - runtime: JVM
            host: jvm
            name: macOS arm64
            runner: macos-14
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    env:
      HEGEL_CACHE_DIR: ${{ github.workspace }}/.hegel-lib
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenSSL for Jolt on macOS
        if: matrix.host == 'jolt' && runner.os == 'macOS'
        run: brew install openssl@3

      - name: Install Jolt
        if: matrix.host == 'jolt'
        uses: ./.github/actions/setup-jolt
        with:
          version: ${{ matrix.jolt-version }}
          asset: ${{ matrix.jolt-asset }}
          sha256: ${{ matrix.jolt-sha256 }}

      - name: Make Git for Windows libffi discoverable
        if: matrix.host == 'bb' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $mingw = Join-Path $env:ProgramFiles 'Git\mingw64\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $mingw 'libffi-8.dll'))) {
            throw 'Git for Windows libffi-8.dll is required by Babashka FFI'
          }
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up JDK 25
        if: matrix.host == 'jvm'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Clojure CLI and official Babashka
        if: matrix.host == 'jvm'
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest

      - name: Set up official FFI-capable Babashka
        if: matrix.host == 'bb'
        uses: ./.github/actions/setup-babashka
        with:
          version: 1.13.220
          asset: ${{ matrix.bb-asset }}
          sha256: ${{ matrix.bb-sha256 }}

      - name: Check corpus integrity without libhegel (Jolt)
        if: matrix.host == 'jolt'
        env:
          HEGEL_LIBHEGEL_LIBRARY: deliberately-missing-corpus-native-library
        run: jolt -M:corpus-test

      - name: Check corpus integrity without libhegel (Babashka)
        if: matrix.host == 'bb'
        env:
          HEGEL_LIBHEGEL_LIBRARY: deliberately-missing-corpus-native-library
        run: bb corpus-test

      - name: Check corpus integrity without libhegel or JVM FFI dependency (JVM)
        if: matrix.host == 'jvm'
        env:
          HEGEL_LIBHEGEL_LIBRARY: deliberately-missing-corpus-native-library
        run: clojure -M:corpus-test

      - name: Install libhegel (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -m hegel.install fetch-libhegel

      - name: Install libhegel (Babashka)
        if: matrix.host == 'bb'
        run: bb -m hegel.install fetch-libhegel

      - name: Install libhegel (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:setup-native

      - name: Check ABI coverage (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -M:abi-test

      - name: Check ABI coverage (Babashka)
        if: matrix.host == 'bb'
        run: bb abi-test

      - name: Check ABI coverage (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:abi-test

      - name: Run semantic suite (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -M:test

      - name: Run contract harness controls (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -M:harness-test

      - name: Probe bootstrap optional loading (Jolt)
        if: matrix.host == 'jolt'
        run: jolt -M:test --bootstrap-load-probe

      - name: Build and relocate standalone resource consumer (Jolt Linux)
        if: matrix.host == 'jolt' && runner.os == 'Linux'
        run: bash script/check-standalone-resources.sh

      - name: Run semantic suite (Babashka)
        if: matrix.host == 'bb'
        run: bb test

      - name: Run contract harness controls (Babashka)
        if: matrix.host == 'bb'
        run: bb harness-test

      - name: Probe bootstrap optional loading (Babashka)
        if: matrix.host == 'bb'
        run: bb test --bootstrap-load-probe

      - name: Reject a literal task name passed as a test argument (Babashka)
        if: matrix.host == 'bb'
        run: >-
          bb -e '(require (quote clojure.java.shell))
          (let [result (clojure.java.shell/sh "bb" "test" "test" "--list-suites")]
          (when-not (= 2 (:exit result))
          (throw (ex-info "Test task changed user arguments" result))))'

      - name: Run semantic suite (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:test

      - name: Run contract harness controls (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:harness-test

      - name: Probe bootstrap optional loading (JVM)
        if: matrix.host == 'jvm'
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:test --bootstrap-load-probe

      - name: Run Git dependency consumer smoke test (Jolt)
        if: matrix.host == 'jolt'
        working-directory: test/consumer
        run: jolt -A:test -m consumer.smoke

      - name: Run Git dependency consumer smoke test (Babashka)
        if: matrix.host == 'bb'
        working-directory: test/consumer
        run: bb --config bb.edn -m consumer.smoke

      - name: Run Git dependency consumer smoke test (JVM)
        if: matrix.host == 'jvm'
        working-directory: test/consumer
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:test -m consumer.smoke

  jdk22-minimum:
    name: JVM minimum / Linux x86_64
    needs: abi-data
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HEGEL_CACHE_DIR: ${{ github.workspace }}/.hegel-lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '22'
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest
      - name: Install libhegel
        run: clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:setup-native
      - name: Run ABI and semantic suites
        run: |
          clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:abi-test
          clojure -J--enable-native-access=ALL-UNNAMED -M:jvm:test

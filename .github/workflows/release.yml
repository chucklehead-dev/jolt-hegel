name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  portable-ci:
    name: Portable runtime matrix
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify release on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official jolt-lang/jolt v0.8.31 assets, built from source commit
          # 3f9506266ca422e2d1f1370659289cde88cbbf2a.
          - name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
            jolt-asset: jolt-v0.8.31-x86_64-linux.tar.gz
            jolt-sha256: 9c418141581cc4744024c8ec2ea6c2caf14181264455a787ccac9db21e8069da
          - name: Windows x86_64
            runner: windows-2022
            shell: pwsh
            jolt-asset: jolt-v0.8.31-x86_64-windows.zip
            jolt-sha256: 6de623de782d94b03de7bee0eb0bbf37e961a9ce7900fbeb167e31697f550cb6
          - name: macOS arm64
            runner: macos-26
            shell: bash
            jolt-asset: jolt-v0.8.31-aarch64-macos.tar.gz
            jolt-sha256: 856ee3aa7843098ea4a467ef9be9503e6788b049997a929119cf8172efa7bbef

    defaults:
      run:
        shell: ${{ matrix.shell }}

    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenSSL for Jolt on macOS
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - uses: ./.github/actions/setup-jolt
        with:
          version: 0.8.31
          asset: ${{ matrix.jolt-asset }}
          sha256: ${{ matrix.jolt-sha256 }}

      - name: Require matching release tag (POSIX)
        if: runner.os != 'Windows'
        run: |
          expected="v$(jolt -m hegel.install version)"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Require matching release tag (Windows)
        if: runner.os == 'Windows'
        run: |
          $expected = "v$(jolt -m hegel.install version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "release tag mismatch: expected $expected, got $env:GITHUB_REF_NAME"
          }

      - name: Resolve test dependencies over HTTPS
        shell: bash
        run: |
          for delay in 5 15 0; do
            if output=$(jolt -A:test -m hegel.install version 2>&1); then
              echo "$output"
              break
            else
              status=$?
              echo "$output"
              if [[ $delay == 0 || $output != *"could not be fetched"* || ! $output =~ HTTP\ (429|502|503|504) ]]; then
                exit "$status"
              fi
              sleep "$delay"
            fi
          done

      - name: Install native dependencies
        run: jolt -m hegel.install fetch-libhegel

      - name: Run integration suite
        run: jolt -M:test

      - name: Run Git dependency consumer smoke test
        working-directory: test/consumer
        run: jolt -A:test -m consumer.smoke

  publish:
    name: Publish GitHub release
    if: github.repository == 'chucklehead-dev/jolt-hegel'
    needs: [portable-ci, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

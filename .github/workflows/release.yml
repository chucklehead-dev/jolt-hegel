name: Release

on:
  push:
    branches:
      - 'release-v*'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-shim:
    name: Build ${{ matrix.shim-asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            jolt-asset: jolt-v0.7.5-x86_64-linux.tar.gz
            jolt-sha256: 1c037bd4897d6f819eda188483234af03164b7f7ef765ecb86703b62a4edef7e
            shim-asset: jolt-hegel-shim-linux-amd64.so
          - runner: windows-2022
            jolt-asset: jolt-v0.7.5-x86_64-windows.zip
            jolt-sha256: 21f6705992c2448667321fd0dcee990f51ccd2a620e0ac3101444157ebe75dc1
            shim-asset: jolt-hegel-shim-windows-amd64.dll
          - runner: macos-14
            jolt-asset: jolt-v0.7.5-aarch64-macos.tar.gz
            jolt-sha256: f65b597e81cafa99c908115e2ed3898e2bac4edcdabbf4bfc5d291d3e4bbfc0b
            shim-asset: jolt-hegel-shim-darwin-arm64.dylib

    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache
      HEGEL_SHIM_LIBRARY: ${{ github.workspace }}/dist/${{ matrix.shim-asset }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenSSL for Jolt on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install openssl@3

      - uses: ./.github/actions/setup-jolt
        with:
          version: 0.7.5
          asset: ${{ matrix.jolt-asset }}
          sha256: ${{ matrix.jolt-sha256 }}

      - name: Require matching release tag (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          expected="v$(jolt -m hegel.install version)"
          release_tag="${GITHUB_REF_NAME#release-}"
          test "$release_tag" = "$expected"

      - name: Require matching release tag (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = "v$(jolt -m hegel.install version)"
          $releaseTag = $env:GITHUB_REF_NAME -replace '^release-', ''
          if ($releaseTag -ne $expected) {
            throw "release ref $env:GITHUB_REF_NAME does not match $expected"
          }

      - name: Normalize release output path on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Jolt 0.7.5's java.io.File shim does not recognize the backslash-form
          # drive path supplied by github.workspace. Preserve the same absolute
          # coordinate but give Jolt the forward-slash form it accepts.
          echo "HEGEL_SHIM_LIBRARY=$(cygpath -m "$PWD/dist/${{ matrix.shim-asset }}")" >> "$GITHUB_ENV"

      - name: Build and test shim
        shell: bash
        run: |
          mkdir -p dist
          jolt -m hegel.install fetch-libhegel
          jolt -m hegel.install build-shim
          jolt -M:test

      - name: Write checksum (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="$(basename "$HEGEL_SHIM_LIBRARY")"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            hash="$(shasum -a 256 "$HEGEL_SHIM_LIBRARY" | awk '{print $1}')"
          else
            hash="$(sha256sum "$HEGEL_SHIM_LIBRARY" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$hash" "$name" > "$HEGEL_SHIM_LIBRARY.sha256"

      - name: Write checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:HEGEL_SHIM_LIBRARY).Hash.ToLowerInvariant()
          $name = [IO.Path]::GetFileName($env:HEGEL_SHIM_LIBRARY)
          Set-Content -NoNewline -LiteralPath "$env:HEGEL_SHIM_LIBRARY.sha256" -Value "$hash  $name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shim-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.repository == 'chucklehead-dev/jolt-hegel'
    needs: build-shim
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: shim-*
          path: dist
          merge-multiple: true

      - name: Create release and upload shims
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="${GITHUB_REF_NAME#release-}"
          gh release create "$release_tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

  verify-release:
    name: Verify published shim on ${{ matrix.name }}
    if: github.repository == 'chucklehead-dev/jolt-hegel'
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            jolt-asset: jolt-v0.7.5-x86_64-linux.tar.gz
            jolt-sha256: 1c037bd4897d6f819eda188483234af03164b7f7ef765ecb86703b62a4edef7e
          - name: Windows x86_64
            runner: windows-2022
            jolt-asset: jolt-v0.7.5-x86_64-windows.zip
            jolt-sha256: 21f6705992c2448667321fd0dcee990f51ccd2a620e0ac3101444157ebe75dc1
          - name: macOS arm64
            runner: macos-14
            jolt-asset: jolt-v0.7.5-aarch64-macos.tar.gz
            jolt-sha256: f65b597e81cafa99c908115e2ed3898e2bac4edcdabbf4bfc5d291d3e4bbfc0b

    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenSSL for Jolt on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install openssl@3

      - uses: ./.github/actions/setup-jolt
        with:
          version: 0.7.5
          asset: ${{ matrix.jolt-asset }}
          sha256: ${{ matrix.jolt-sha256 }}

      - name: Download released native dependencies
        working-directory: test/consumer
        shell: bash
        run: |
          jolt -A:test -m hegel.install fetch-libhegel
          jolt -A:test -m hegel.install fetch-shim

      - name: Run against the downloaded release shim
        working-directory: test/consumer
        shell: bash
        run: jolt -A:test -m consumer.smoke

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  portable-ci:
    name: Portable runtime matrix
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify release on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official jolt-lang/jolt v0.8.27 assets, built from source commit
          # 0f08ec2732a0078d7523f274a1507049c06bffe6.
          - name: Linux x86_64
            runner: ubuntu-24.04
            shell: bash
            jolt-asset: jolt-v0.8.27-x86_64-linux.tar.gz
            jolt-sha256: 7aedce645a5840772a74e0341da73e6e072f41107ee2b304fc7a4947021a64b4
          - name: Windows x86_64
            runner: windows-2022
            shell: pwsh
            jolt-asset: jolt-v0.8.27-x86_64-windows.zip
            jolt-sha256: 9980fcb13ece3ae6610fb4af3ca538a5e19a69a5443aff56aff176a90cb96a76
          - name: macOS arm64
            runner: macos-26
            shell: bash
            jolt-asset: jolt-v0.8.27-aarch64-macos.tar.gz
            jolt-sha256: c85fb07350811d9b0762423b100796703d18a2bd6c7c4462a69b04a6f770177a

    defaults:
      run:
        shell: ${{ matrix.shell }}

    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenSSL for Jolt on macOS
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - uses: ./.github/actions/setup-jolt
        with:
          version: 0.8.27
          asset: ${{ matrix.jolt-asset }}
          sha256: ${{ matrix.jolt-sha256 }}

      - name: Require matching release tag (POSIX)
        if: runner.os != 'Windows'
        run: |
          expected="v$(jolt -m hegel.install version)"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Require matching release tag (Windows)
        if: runner.os == 'Windows'
        run: |
          $expected = "v$(jolt -m hegel.install version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "release tag mismatch: expected $expected, got $env:GITHUB_REF_NAME"
          }

      - name: Resolve test dependencies over HTTPS
        run: jolt -A:test -m hegel.install version

      - name: Install native dependencies
        run: jolt -m hegel.install fetch-libhegel

      - name: Run integration suite
        run: jolt -M:test

      - name: Run Git dependency consumer smoke test
        working-directory: test/consumer
        run: jolt -A:test -m consumer.smoke

  publish:
    name: Publish GitHub release
    if: github.repository == 'chucklehead-dev/jolt-hegel'
    needs: [portable-ci, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  portable-ci:
    name: Portable runtime matrix
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify release on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            jolt-asset: jolt-v0.7.23-x86_64-linux.tar.gz
            jolt-sha256: feda9a68792b454fa540677069edc6b6d9b82aa8ab77ae8a322934f0b8cd32e7
          - name: Windows x86_64
            runner: windows-2022
            jolt-asset: jolt-v0.7.23-x86_64-windows.zip
            jolt-sha256: d414dc30d6992613f8bf1bd6a5fd709fd583ef564ce9b684bc2f90a5be498074
          - name: macOS arm64
            runner: macos-14
            jolt-asset: jolt-v0.7.23-aarch64-macos.tar.gz
            jolt-sha256: 2e4b9804382548b58b10079aa73688afe587d7b6d0986ee52c61f843ae912bb9

    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenSSL for Jolt on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install openssl@3

      - uses: ./.github/actions/setup-jolt
        with:
          version: 0.7.23
          asset: ${{ matrix.jolt-asset }}
          sha256: ${{ matrix.jolt-sha256 }}

      - name: Require matching release tag
        shell: bash
        run: |
          expected="v$(jolt -m hegel.install version)"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Install native dependencies
        shell: bash
        run: jolt -m hegel.install fetch-libhegel

      - name: Run integration suite
        shell: bash
        run: jolt -M:test

      - name: Run Git dependency consumer smoke test
        working-directory: test/consumer
        shell: bash
        run: jolt -A:test -m consumer.smoke

  publish:
    name: Publish GitHub release
    if: github.repository == 'chucklehead-dev/jolt-hegel'
    needs: [portable-ci, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

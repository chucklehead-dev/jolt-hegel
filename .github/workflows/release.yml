name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-shim:
    name: Build ${{ matrix.shim-asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            jolt-asset: joltc-v0.4.15-x86_64-linux.tar.gz
            jolt-sha256: 90d7be25b506f534f52086944353ba39c9f499022b20f57ed5992ada98c2ad7a
            shim-asset: jolt-hegel-shim-linux-amd64.so
          - runner: windows-2022
            jolt-asset: joltc-v0.4.15-x86_64-windows.zip
            jolt-sha256: 7f5f84a1f76e6bd8479519d7e3609134fb62c5d5d0d42d5a444380ef2a1f6f5b
            shim-asset: jolt-hegel-shim-windows-amd64.dll
          - runner: macos-14
            jolt-asset: joltc-v0.4.15-aarch64-macos.tar.gz
            jolt-sha256: 2f56b2ae6e11faf104afbf0d64afc42b073ae81bb7da6993c1e1756096f451b2
            shim-asset: jolt-hegel-shim-darwin-arm64.dylib

    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache
      HEGEL_SHIM_LIBRARY: ${{ github.workspace }}/dist/${{ matrix.shim-asset }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenSSL for Jolt on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install openssl@3

      - uses: ./.github/actions/setup-jolt
        with:
          version: 0.4.15
          asset: ${{ matrix.jolt-asset }}
          sha256: ${{ matrix.jolt-sha256 }}

      - name: Require matching release tag (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          expected="v$(joltc -m hegel.install version)"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Require matching release tag (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = "v$(joltc -m hegel.install version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "release tag $env:GITHUB_REF_NAME does not match $expected"
          }

      - name: Build and test shim
        shell: bash
        run: |
          joltc -m hegel.install fetch-libhegel
          joltc -m hegel.install build-shim
          joltc -M:test

      - name: Write checksum (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="$(basename "$HEGEL_SHIM_LIBRARY")"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            hash="$(shasum -a 256 "$HEGEL_SHIM_LIBRARY" | awk '{print $1}')"
          else
            hash="$(sha256sum "$HEGEL_SHIM_LIBRARY" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$hash" "$name" > "$HEGEL_SHIM_LIBRARY.sha256"

      - name: Write checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:HEGEL_SHIM_LIBRARY).Hash.ToLowerInvariant()
          $name = [IO.Path]::GetFileName($env:HEGEL_SHIM_LIBRARY)
          Set-Content -NoNewline -LiteralPath "$env:HEGEL_SHIM_LIBRARY.sha256" -Value "$hash  $name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shim-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.repository == 'chucklehead-dev/jolt-hegel'
    needs: build-shim
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: shim-*
          path: dist
          merge-multiple: true

      - name: Create release and upload shims
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

  verify-release:
    name: Verify published shim on ${{ matrix.name }}
    if: github.repository == 'chucklehead-dev/jolt-hegel'
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            jolt-asset: joltc-v0.4.15-x86_64-linux.tar.gz
            jolt-sha256: 90d7be25b506f534f52086944353ba39c9f499022b20f57ed5992ada98c2ad7a
          - name: Windows x86_64
            runner: windows-2022
            jolt-asset: joltc-v0.4.15-x86_64-windows.zip
            jolt-sha256: 7f5f84a1f76e6bd8479519d7e3609134fb62c5d5d0d42d5a444380ef2a1f6f5b
          - name: macOS arm64
            runner: macos-14
            jolt-asset: joltc-v0.4.15-aarch64-macos.tar.gz
            jolt-sha256: 2f56b2ae6e11faf104afbf0d64afc42b073ae81bb7da6993c1e1756096f451b2

    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenSSL for Jolt on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install openssl@3

      - uses: ./.github/actions/setup-jolt
        with:
          version: 0.4.15
          asset: ${{ matrix.jolt-asset }}
          sha256: ${{ matrix.jolt-sha256 }}

      - name: Download released native dependencies
        working-directory: test/consumer
        shell: bash
        run: |
          joltc -A:test -m hegel.install fetch-libhegel
          joltc -A:test -m hegel.install fetch-shim

      - name: Run against the downloaded release shim
        working-directory: test/consumer
        shell: bash
        run: joltc -A:test -m consumer.smoke

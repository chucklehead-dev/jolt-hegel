name: Experimental jank

on:
  pull_request:
    paths:
      - '.github/workflows/jank.yml'
      - 'bb.edn'
      - 'resources/hegel/abi.edn'
      - 'script/hegel/**'
      - 'src/hegel/**'
  push:
    branches: [main, codex/jank-portable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jank-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-bindings:
    name: jank generated bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          bb: latest
      - name: Verify generated ABI artifacts
        run: bb jank-codegen-check

  runtime:
    name: jank / ${{ matrix.name }}
    needs: generated-bindings
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            library-name: libhegel_c.so
            library-sha256: 12d804f8767f926f8ec22a733e57af265f0b79f383ce78cc8d9fcbae2a8a3ad7
          - name: macOS arm64
            runner: macos-26
            library-name: libhegel_c.dylib
            library-sha256: ac3939a523ca5d98ed741e5894c3b44d0c7b0fa8baaa3deabc5653bb1d754df9

    env:
      HEGEL_CACHE_DIR: ${{ github.workspace }}/.hegel-lib

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          bb: latest
      - name: Install pinned jank package (Linux)
        if: runner.os == 'Linux'
        env:
          # The PPA publishes continuous builds at this stable URL. This digest
          # was verified against its 2026-09-06 signed noble package index
          # (signing fingerprint 3914A6761EC1FF9C8F735BBABB90C586E7196C2B).
          JANK_DEB_SHA256: 93024e81e8f3ab2b29b3480f5cc5ae5da2a5e6361d411fd79f7450a5db1c6a66
        run: |
          curl -fsSLo "$RUNNER_TEMP/jank.deb" \
            https://ppa.jank-lang.org/pool/main/j/jank/jank_0.1-noble_amd64.deb
          echo "$JANK_DEB_SHA256  $RUNNER_TEMP/jank.deb" | sha256sum --check --strict
          sudo apt-get update
          sudo apt-get install --yes "$RUNNER_TEMP/jank.deb"
      - name: Set up jank (macOS)
        if: runner.os == 'macOS'
        uses: jank-lang/setup-jank@89538130d4395e4b0301c938b027b9309712a0cc
      - name: Record and verify jank toolchain
        run: |
          jank print-binary-version
          jank check-health
      - name: Install checksum-verified libhegel through jank
        run: >-
          jank -I generated --module-path src:resources:script
          run-main hegel.install -- setup
      - name: Independently verify installed libhegel digest
        env:
          LIBHEGEL_SHA256: ${{ matrix.library-sha256 }}
        run: |
          library="$GITHUB_WORKSPACE/.hegel-lib/${{ matrix.library-name }}"
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            actual=$(sha256sum "$library" | cut -d ' ' -f 1)
          else
            actual=$(shasum -a 256 "$library" | cut -d ' ' -f 1)
          fi
          test "$actual" = "$LIBHEGEL_SHA256"
      - name: Run direct ABI backend smoke
        env:
          HEGEL_LIBHEGEL_LIBRARY: ${{ github.workspace }}/.hegel-lib/${{ matrix.library-name }}
        run: >-
          jank -I generated --module-path src:resources:script
          run-main hegel.jank-backend-smoke
      - name: Run focused shared-semantics smoke
        env:
          HEGEL_LIBHEGEL_LIBRARY: ${{ github.workspace }}/.hegel-lib/${{ matrix.library-name }}
        run: >-
          jank -I generated --module-path src:resources:script
          run-main hegel.jank-property-smoke

name: Setup Jolt
description: Install a checksum-pinned Jolt release on a GitHub-hosted runner

inputs:
  version:
    description: Jolt release version without the v prefix
    required: true
  asset:
    description: Jolt release asset filename
    required: true
  sha256:
    description: Expected SHA-256 for the release asset
    required: true

runs:
  using: composite
  steps:
    - name: Install Jolt (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      env:
        JOLT_SETUP_VERSION: ${{ inputs.version }}
        JOLT_SETUP_ASSET: ${{ inputs.asset }}
        JOLT_SETUP_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/$JOLT_SETUP_ASSET"
        install_dir="$RUNNER_TEMP/jolt"
        curl -fsSL \
          "https://github.com/jolt-lang/jolt/releases/download/v$JOLT_SETUP_VERSION/$JOLT_SETUP_ASSET" \
          -o "$archive"
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
        else
          actual="$(sha256sum "$archive" | awk '{print $1}')"
        fi
        if [[ "$actual" != "$JOLT_SETUP_SHA256" ]]; then
          echo "Jolt SHA-256 mismatch: expected $JOLT_SETUP_SHA256, got $actual" >&2
          exit 1
        fi
        mkdir -p "$install_dir"
        tar -xzf "$archive" -C "$install_dir" --strip-components=1
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Install Jolt (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        JOLT_SETUP_VERSION: ${{ inputs.version }}
        JOLT_SETUP_ASSET: ${{ inputs.asset }}
        JOLT_SETUP_SHA256: ${{ inputs.sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $archive = Join-Path $env:RUNNER_TEMP $env:JOLT_SETUP_ASSET
        $installDir = Join-Path $env:RUNNER_TEMP 'jolt'
        $url = "https://github.com/jolt-lang/jolt/releases/download/v$env:JOLT_SETUP_VERSION/$env:JOLT_SETUP_ASSET"
        Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $archive
        $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
        if ($actual -ne $env:JOLT_SETUP_SHA256) {
          throw "Jolt SHA-256 mismatch: expected $env:JOLT_SETUP_SHA256, got $actual"
        }
        Expand-Archive -LiteralPath $archive -DestinationPath $installDir
        $root = Join-Path $installDir "jolt-v$env:JOLT_SETUP_VERSION-x86_64-windows"
        $root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify Jolt
      shell: bash
      run: jolt --version
